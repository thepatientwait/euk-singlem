[workspace]
name = "euk-singlem-metapackage"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# Snakemake (9.x) has no native pixi support, but its `conda:` directive accepts the path
# of an existing environment directory. Each rule group below gets its own environment at
# .pixi/envs/<name>; rules reference them via `env("<name>")` in the snakefiles
# (subworkflows/*.smk).
#
#   pixi install --all      # create/update every environment (needs network)
#   pixi run snakemake -c8  # run the workflow (driver = default env)

[dependencies]            # default env: the snakemake driver (also runs every rule without a `conda:`)
python = "3.12.*"
snakemake = ">=9.0"
snakemake-executor-plugin-cluster-generic = "*"
polars = "*"
pyyaml = "*"
pandas = "*"
biopython = "*"
joblib = "*"
requests = "*"
certifi = "*"
tqdm = "*"
ncbi-datasets-cli = "*"   # download_genome.py, fetch_ncbi_taxonomy.py
[pypi-dependencies]
jq = "*"                  # helpers.py parses the JGI json with the python jq bindings

[activation]
# snakemake activates rule environments through conda's `activate`
env = { PATH = "/mnt/weka/pkg/cmr/sw/conda/condabin:$PATH" }

# SingleM create / regenerate / chainsaw and the off-target HMM searches
[feature.singlem.dependencies]
python = "3.12.*"
singlem = ">=0.19.0"
hmmer = "*"
parallel = ">=20240122"
polars = "*"
biopython = "*"

[feature.graftm.dependencies]
graftm = "*"

# BUSCO runs (run_busco, init_busco_lineage_cache)
[feature.busco.dependencies]
python = "3.12.*"
busco = ">=5"

# genome dereplication (dereplicate_genomes calls `coverm cluster`)
[feature.coverm.dependencies]
coverm = "0.7.*"

[environments]
default = { solve-group = "all" }
singlem = { features = ["singlem"], no-default-feature = true }
graftm  = { features = ["graftm"],  no-default-feature = true }
busco   = { features = ["busco"],   no-default-feature = true }
coverm  = { features = ["coverm"],  no-default-feature = true }

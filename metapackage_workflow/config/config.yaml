
# Organism groups to process
groups:
  - fungi
  - algae

# Genomes already on disk are never re-requested. Zero-byte files are failure markers
# (e.g. suppressed assemblies); set true to retry those on the next run.
retry_failed_downloads: false

# JGI genomes on tape (PURGED) must be restored by JGI first (up to ~24 h).
# request_jgi_restores: send batched restore requests as part of the download phase
# jgi_wait_for_restore: genomes not yet restored get a download job that polls JGI every
#   jgi_poll_minutes and downloads once the file is restored. Attempts run 2 h, 4 h, 6 h
#   (~12 h, about the life of a token); keep jgi_token in secrets.yaml current while it waits.
#   false: such genomes get no job until a metadata refresh shows them restored.
# jgi_max_concurrent: JGI downloads allowed to run at once (the API fails when flooded);
#   jobs that are only waiting do not count
# The JGI file lists are not re-fetched automatically; to refresh them (restore statuses):
#   snakemake --forcerun download_jgi_metadata   (or delete outputs/metadata/source/jgi/*.json)
request_jgi_restores: true
jgi_wait_for_restore: true
jgi_poll_minutes: 15
jgi_max_concurrent: 10

# JGI API URLs for metadata download
jgi_config:
  fungi:
    json_url: 'https://files.jgi.doe.gov/mycocosm_file_list/?api_version=2&d=asc&group=fungi&ff=%7B%22file_type%22%3A%5B%22assembly%22%5D%2C%22data_type%22%3A%5B%22Genome+Assembly+%28masked%29%22%5D%2C%22data_utilization_status%22%3A%5B%22Unrestricted%22%5D%2C%22file_name_pattern%22%3A%22.*%5C%5C.gz%22%7D&s=name&x=50'
    meta_url: 'https://mycocosm.jgi.doe.gov/ext-api/mycocosm/catalog/download-group?flt=&seq=all&pub=all&grp=fungi&srt=released&ord=desc'
  algae:
    json_url: 'https://files.jgi.doe.gov/mycocosm_file_list/?api_version=2&d=asc&group=phycocosm&ff=%7B%22file_type%22%3A%5B%22assembly%22%5D%2C%22data_type%22%3A%5B%22Genome+Assembly+%28masked%29%22%5D%2C%22data_utilization_status%22%3A%5B%22Unrestricted%22%5D%2C%22file_name_pattern%22%3A%22.*.gz%22%7D&s=name&x=50'
    meta_url: 'https://phycocosm.jgi.doe.gov/ext-api/phycocosm/catalog/download-group?flt=&seq=all&pub=all&grp=phycocosm&srt=released&ord=desc'

# BUSCO configuration
busco:
  lineage: eukaryota_odb12
  mode: genome
  quality_control:
    min_complete_markers: 40
    # Include Duplicated BUSCO genes, represented by their top-scoring copy (one sequence per
    # gene per genome). Must be set here: the workflow reads busco.quality_control.use_multi_copy.
    use_multi_copy: true
    # Which copy represents a Duplicated gene: "peer" = the copy with the highest mean identity to
    # Complete copies of the same gene from the same taxon (scripts/peer_copy_selection.py; reports
    # every decision in multicopy_selection.tsv); "top_score" = best BUSCO score.
    multi_copy_selection: peer
    # The top score is only overruled when the best peer-like copy beats it by this much mean identity
    # (smaller differences are within noise).
    multi_copy_min_gain: 0.02

# NCBI Entrez configuration
ncbi:
  email: 'mitcheja@qut.edu.au'
  tax_id: 2759
  reference_only: false
  include_metazoa_viridiplantae_refs: true

# SingleM configuration
singlem:
  target_domains: 'Eukaryota'
  min_sequences_per_gene: 5
  allow_missing_taxonomy: false  # true keeps sequences/genomes without a usable taxonomy
  derep:
    enabled: false
    precluster_ani: 90
    ani: 95
  # Introns. SingleM windows are matched against metagenomic DNA reads, which cannot cross an
  # intron, so a window that spans one is not recoverable from the genomes that have it.
  # Two metapackage variants (wildcard `introns`):
  #   corrected: best-covered window crossing an intron in at most max_span_fraction of the genomes
  #              covering it; nucleotide-database sequences are cut at introns
  #   naive:     best-covered window, introns ignored; nucleotide-database sequences are whole gene spans.
  #              A negative control, off by default (it doubles the transcript and packaging work).
  #              The survey always computes both windows, so the notebook compares them either way.
  introns:
    build_naive: false      # true: also build the naive metapackage
    min_intron: 30          # genomic gaps shorter than this (nt) are frameshifts, not introns
    min_exon_nt: 60         # corrected transcripts are cut at introns; shorter pieces are dropped
    max_span_fraction: 0.05
    score_tolerance: 0.005  # windows within this fraction of the best score are equally covered; take the one with fewest introns
    min_valid_genomes: 20   # genomes with a mapped gene model needed to judge a window
    strict: false           # true: fail the run if any gene has no corrected window under max_span_fraction
    # Quick-check subset of the genomes already in the BUSCO QC manifest (outputs go to outputs/subset_<name>/,
    # off-target decoys are skipped): none | family5 | jgi_p10k | jgi_p10k_family5
    # (or `--config subset=family5`). family5 = subset_per_family random genomes from every family.
    subset: none
    subset_per_family: 5
    subset_seed: 1
  off_target:
    enabled: true
    hmm_evalue: 1e-5
    default_taxonomy: 'd__Bacteria'
    keep_intermediates: false

# Resource allocation
resources:
  base_mem_mb: 4000
  base_runtime: '4h'
  total_attempts: 3
  
  # Rule-specific overrides
  busco_threads: 2
  download_threads: 1
  coverm_cluster_threads: 64

orchestration:
  profile: "~/git/hpc_scripts/snakemake_configs/aqua"
  use_conda: true
  rerun_incomplete: true
  extra_args: ""
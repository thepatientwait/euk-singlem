# Centralized path definitions for euk-singlem metapackage workflow
# Organized by workflow phase and purpose

# === Phase 1: Download Data ===
download:
  done_flag: "outputs/orchestration/phase1_download.done"

  metadata:
    jgi:
      json: "data/{group}.json"
      csv: "data/{group}_meta.csv"
    p10k:
      csv: "data/p10k_meta.csv"
    taxonomy:
      mapping: "outputs/metadata/taxonomy_mapping.tsv"

  genomes:
    by_group: "outputs/genomes/{group}/{genome_acc}.fasta.gz"
    p10k: "outputs/genomes/p10k/{genome_acc}.fasta.gz"

  cleanup:
    report: "outputs/metadata/failed_genome_cleanup_report.tsv"
    done_flag: "outputs/metadata/cleanup_failed_genomes.done"

  manifest:
    genome: "outputs/metadata/genomes_to_process.paths"

# === Phase 2: Generate SingleM/GraftM Packages ===
generate:
  done_flag: "outputs/orchestration/phase2_generate.done"

  busco:
    full_table: "outputs/busco/{group}/{genome_acc}/run_eukaryota_odb12/full_table.tsv"
    quality_control_results: "outputs/metadata/busco_quality_control_results.tsv"
    output_dir: "outputs/busco/{group}"

  quality_report:
    checkm2_style: "outputs/metadata/checkm2_quality_report.tsv"

  derep_manifest:
    busco_filtered: "outputs/metadata/busco_quality_control_dereplicated.tsv"

  derep:
    cluster_definitions: "outputs/metadata/genome_clusters.tsv"
    representatives: "outputs/metadata/dereplicated_genome_representatives.txt"

  singlem:
    config:
      output_directory: "outputs/singlem_metapackage"
      metapackage_path: "outputs/eukaryote.smpkg"
      genome_packages_dir: "outputs/singlem_genome_packages"
      genome_packages_metapackage: "outputs/singlem_genome_packages/eukaryotic_busco_metapackage.smpkg"
    off_target:
      input:
        gtdb_metadata:
          archaea: "/mnt/hpccs01/work/microbiome/db/gtdb/gtdb_release226/ar53_metadata_r226.tsv.gz"
          bacteria: "/mnt/hpccs01/work/microbiome/db/gtdb/gtdb_release226/bac120_metadata_r226.tsv.gz"
        # GTDB representative genomes database root.
        # Example resolved path:
        # /mnt/hpccs01/work/microbiome/db/gtdb/gtdb_release226/genomic_files_reps/gtdb_genomes_reps_r226/database/GCF/000/006/685/GCF_000006685.1_genomic.fna.gz
        gtdb_genomes_database_dir: "/mnt/hpccs01/work/microbiome/db/gtdb/gtdb_release226/genomic_files_reps/gtdb_genomes_reps_r226/database"
        # Optional fallback template for pre-materialized genome FASTA paths.
        genome_by_accession: null
      hmms:
        concatenated: "outputs/euk_packages/off_target/new_hmms_concat.hmm"
        ids: "outputs/euk_packages/off_target/new_hmms_ids.tsv"
        done: "outputs/euk_packages/off_target/acquire_hmms.done"
      per_genome:
        result: "outputs/euk_packages/off_target/per_genome_results/{off_target_id}.tsv"
      search:
        results: "outputs/euk_packages/off_target/hmmsearch/{off_target_id}.txt"
        matches: "outputs/euk_packages/off_target/get_matches/{off_target_id}.tsv"
        sequences: "outputs/euk_packages/off_target/mfqe/{off_target_id}.faa"
      aggregate:
        dir: "outputs/euk_packages/off_target/hmmseq_concat"
        done: "outputs/euk_packages/off_target/aggregate.done"
        sequences: "outputs/euk_packages/off_target/hmmseq_concat/{busco_gene}.faa"
        taxonomy: "outputs/euk_packages/off_target/hmmseq_concat/{busco_gene}_taxonomy.tsv"
      prepare:
        done: "outputs/euk_packages/off_target/prepare.done"
        sequences: "outputs/euk_packages/off_target/prepared/{busco_gene}.faa"
        taxonomy: "outputs/euk_packages/off_target/prepared/{busco_gene}_taxonomy.tsv"
      regenerate:
        spkg: "outputs/euk_packages/regenerate/{busco_gene}.spkg"
    gene_input:
      sequences_dir: "outputs/singlem_input"
      gene:
        fasta: "outputs/singlem_input/{busco_gene}.faa"
        taxonomy: "outputs/singlem_input/{busco_gene}_taxonomy.tsv"
    genome_input:
      genomes_dir: "outputs/singlem_genome_input/genomes"
      genome_protein_files: "outputs/singlem_genome_input/genome_protein_files.txt"
      hmms_and_names: "outputs/singlem_genome_input/hmms_and_names_busco.tsv"
      genome_taxonomy: "outputs/singlem_genome_input/genome_taxonomy.tsv"
    windows:
      positions: "outputs/euk_packages/singlem_seqs/{busco_gene}.window_position.txt"
    packages:
      initial_spkg: "outputs/euk_packages/initial_spkgs/{busco_gene}.spkg"
      final_spkg: "outputs/euk_packages/final_packages/{busco_gene}.spkg"
      regenerated_spkg: "outputs/euk_packages/regenerate/{busco_gene}.spkg"
    metapackages:
      draft: "outputs/euk_packages/draft_metapackage.smpkg"
      final: "outputs/euk_packages/final_metapackage.smpkg"
      valid_packages_manifest: "outputs/euk_packages/valid_singlem_packages.txt"
      invalid_packages_report: "outputs/euk_packages/invalid_singlem_packages.tsv"

  graftm:
    package: "outputs/euk_packages/gpkgs/{busco_gene}.gpkg"
    alignment: "outputs/euk_packages/gpkgs/{busco_gene}.gpkg/{busco_gene}.gpkg.refpkg/{busco_gene}_deduplicated_aligned.fasta"

  transcripts:
    extracted: "outputs/transcripts/{group}/{genome_acc}.fasta"
    singlem_otu: "outputs/transcript_singlem/{group}/{genome_acc}.otu_table.tsv"
    taxonomy_otu: "outputs/transcript_taxonomy/{group}/{genome_acc}.otu_table.tsv"
    aggregate:
      combined_otu: "outputs/assign_taxonomy/transcripts.otu_table.tsv"
      sdb: "outputs/taxonomy/transcripts.sdb"

common:
  busco_hmm:
    dir: "busco_downloads/lineages/eukaryota_odb12/hmms"
    file: "busco_downloads/lineages/eukaryota_odb12/hmms/{busco_gene}.hmm"
  environments:
    singlem: "envs/singlem.yml"

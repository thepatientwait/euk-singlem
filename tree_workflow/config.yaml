metapackage:
  singlem_input_dir: "../metapackage_workflow/outputs/singlem/input"
  valid_packages_manifest: "../metapackage_workflow/outputs/metadata/qc/valid_singlem_packages.txt"
  taxonomy_mapping: "../metapackage_workflow/outputs/metadata/taxonomy/taxonomy_mapping.tsv"
  # genomes the metapackage processes (paths relative to the metapackage workflow); used to find unresolved genomes
  genome_manifest: "../metapackage_workflow/outputs/metadata/manifests/genomes_to_process.paths"
  busco_qc: "../metapackage_workflow/outputs/metadata/qc/busco_quality_control_results.tsv"
  # genomes kept for the dereplicated tree (metapackage workflow rule dereplicate_genomes)
  derep_representatives: "../metapackage_workflow/outputs/metadata/qc/dereplicated_genome_representatives.txt"

tree:
  # trees to build: "all" genomes and/or the "derep" representatives
  derep_modes: ["all", "derep"]
  # "single": Complete BUSCO genes only; "multi": plus the top copy of Duplicated genes
  copy_modes: ["single", "multi"]
  # Quick-check subset (or `--config subset=family5`): none | family5 | jgi_p10k | jgi_p10k_family5.
  # Outputs go to output_subset_<name>/. family5 = 5 random genomes per family.
  subset: "none"
  subset_per_family: 5
  subset_external: 50     # random external genomes added to every subset
  subset_seed: 1
  # publish_trees copies the final trees + metadata into <publish_dir>/<date_time>/ (new dir each time)
  publish_dir: "~/trees"
  fasttree_args: "-lg -gamma"   # protein model; "-nt" (nucleotide) is wrong for this amino-acid alignment
  fasttree_threads: 8
  fasttree_runtime: "16h"   # attempts: 16 h, 32 h, 48 h (the 3.7k-taxon test took 44 min on 4 threads; time grows steeply with taxa)
  diagnostics_pairs: 2000           # genome pairs sampled per rank in the diagnostics notebook
  diagnostics_multicopy_cases: 400  # Duplicated BUSCO genes evaluated

external:
  enabled: true
  group_name: "external"
  genome_manifest: "inputs/external_genomes.paths"
  cluster_table: "/work/microbiome/binchicken/DeepOceanEukaryotes/clusters/genome_clusters_95.tsv"
  cluster_base_dir: "/work/microbiome/binchicken/DeepOceanEukaryotes"
  ncbi_taxid_map: "inputs/external_genome_taxids.tsv"
  # Also run the metapackage genomes with tax_status "unresolved" (no usable lineage; 263 p10k genomes) through
  # this route, so the tree takes them as targets. Their sequences are dropped from the metapackage on purpose.
  include_unresolved: true

outgroup:
  enabled: false
  name: "outgroup"
  genome_manifest: "metadata/asgard_genomes.csv"

busco:
  lineage: "eukaryota_odb12"
  mode: "genome"
  condense: true   # keep full_table + 3 condensed files per genome (see metapackage_workflow/scripts/busco_run.py)
  min_complete_markers: 20
  # Include Duplicated BUSCO genes, each represented by its top-scoring copy (one sequence per
  # gene per genome). Keep equal to busco.quality_control.use_multi_copy of the metapackage
  # workflow, which produces the base genomes' sequences.
  use_multi_copy: true
  # Which copy represents a Duplicated gene: "peer" (highest mean identity to Complete copies of
  # the same gene from the same taxon) or "top_score" (best BUSCO score). Applies to the external
  # and subset aggregations here, where peers are only the genomes of that aggregation; the base
  # genomes' choice is busco.quality_control.multi_copy_selection in the metapackage workflow.
  multi_copy_selection: peer
  multi_copy_min_gain: 0.02   # see the metapackage config

aggregation:
  min_sequences_per_gene: 20
  allow_missing_taxonomy: true  # keep genomes/sequences without taxonomy (needed for tree building)

eukcc:
  threads: 2
  mem_mb: 12000
  command_template: "eukcc single --threads {threads} --out {outdir} {genome}"
  db: "db/eukcc/eukcc2_db_ver_1.2"
  db_url: "http://ftp.ebi.ac.uk/pub/databases/metagenomics/eukcc/eukcc2_db_ver_1.2.tar.gz"
  taxonomy_hint_file: "taxonomy.tsv"

ncbi:
  email: "mitcheja@qut.edu.au"
  strict_requery: false

alignment:
  bmge_h: 0.6
  bmge_g: 0.6
  bmge_matrix: "BLOSUM62"
  min_genes_per_genome: 20   # genomes with fewer genes in the supermatrix are left out of the tree

taxonomy:
  phylorank_command: "phylorank"
  masking_fraction: 0.15     # label_masking validation: share of reference labels hidden
  masking_replicates: 5

resources:
  base_mem_mb: 8000
  base_runtime: "2h"
  total_attempts: 3
  busco_threads: 8
